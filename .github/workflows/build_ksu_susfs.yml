name: Build Kernel 4.19 + KSU + SUSFS (X00TD) - Debug Mode

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Path file defconfig'
        required: true
        default: 'arch/arm64/configs/vendor/asus/X00TD_defconfig'
      device_name:
        description: 'Nama device untuk label output'
        required: true
        default: 'Asus_X00TD'

jobs:
  build:
    name: Build Kernel with KSU & SUSFS
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git python3 build-essential libssl-dev bc bison flex libelf-dev \
                                  clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 🔧 Auto-Fix nohz_flags Error
        run: |
          echo "Mencoba memperbaiki error implicit declaration 'nohz_flags'..."
          python3 -c "
          import re
          try:
              with open('kernel/sched/core.c', 'r') as f:
                  content = f.read()
              content = re.sub(
                  r'(\s+)if \(!atomic_fetch_or\(NOHZ_KICK_MASK, nohz_flags\(cpu\)\)\)',
                  r'\1#ifdef CONFIG_NO_HZ_COMMON\n\1if (!atomic_fetch_or(NOHZ_KICK_MASK, nohz_flags(cpu)))\n\1#endif',
                  content
              )
              with open('kernel/sched/core.c', 'w') as f:
                  f.write(content)
              print('✅ Fix nohz_flags berhasil!')
          except FileNotFoundError:
              print('⚠️ File kernel/sched/core.c tidak ditemukan.')
          "

      - name: 🛡️ Setup KernelSU
        run: |
          echo "Mengunduh KernelSU v0.9.5..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: 🛡️ Apply SUSFS Patch (Debug Mode)
        run: |
          echo "Mengunduh patch SUSFS untuk kernel 4.19..."
          curl -sSL https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.19/kernel_patches/50_add_susfs_in_kernel-4.19.patch -o susfs.patch
          
          echo "=========================================="
          echo "MENCoba APPLY PATCH DENGAN FUZZ FACTOR..."
          echo "=========================================="
          
          # Coba apply dengan fuzz factor (lebih toleran terhadap perbedaan whitespace/indentasi)
          if patch -p1 --fuzz=3 --ignore-whitespace < susfs.patch; then
              echo "✅ Patch SUSFS berhasil diterapkan dengan fuzz factor!"
          else
              echo "❌ Patch tetap gagal. Mencoba generate reject files..."
              
              # Generate .rej files buat lihat file mana yang bentrok
              patch -p1 --reject-file=- < susfs.patch || true
              
              echo "=========================================="
              echo "UPLOAD REJECT FILES SEBAGAI ARTIFACT..."
              echo "=========================================="
              
              # Cari semua file .rej yang di-generate
              find . -name "*.rej" -type f > reject_files.txt
              
              if [ -s reject_files.txt ]; then
                  echo "File-file yang konflik:"
                  cat reject_files.txt
              else
                  echo "Tidak ada reject files yang ter-generate."
              fi
              
              exit 1
          fi

      - name: 📦 Upload Reject Files (Kalau Gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SUSFS_Patch_Reject_Files
          path: |
            *.rej
            reject_files.txt
            susfs.patch

      - name: ⚙️ Enable KSU & SUSFS in Defconfig
        run: |
          echo "Mengaktifkan CONFIG_KSU dan CONFIG_KSU_SUSFS..."
          if [ -f "${{ inputs.defconfig }}" ]; then
              ./scripts/config --file ${{ inputs.defconfig }} --enable KSU
              ./scripts/config --file ${{ inputs.defconfig }} --enable KSU_SUSFS
              echo "✅ Konfigurasi berhasil!"
          else
              echo "❌ File defconfig tidak ditemukan!"
              exit 1
          fi

      - name: 🚀 Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang-14
          export LD=ld.lld-14
          export AR=llvm-ar-14
          export NM=llvm-nm-14
          export OBJCOPY=llvm-objcopy-14
          export OBJDUMP=llvm-objdump-14
          export STRIP=llvm-strip-14
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make -j$(nproc --all) O=out ${{ inputs.defconfig }}
          make -j$(nproc --all) O=out

      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.device_name }}_KSU_SUSFS_Kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/**/*.dtb
