name: Build Kernel 4.19 + KSU + SUSFS (X00TD) - Neutron-like

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Path file defconfig (Biarkan default ini)'
        required: true
        default: 'arch/arm64/configs/vendor/asus/X00TD_defconfig'
      device_name:
        description: 'Nama device untuk label output'
        required: true
        default: 'Asus_X00TD'

jobs:
  build:
    name: Build Kernel with KSU & SUSFS
    runs-on: ubuntu-24.04 # Upgrade ke 24.04 untuk akses Clang 18 yang lebih modern
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies (Modern LLVM)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git python3 build-essential libssl-dev bc bison flex libelf-dev \
                                  clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 🔧 Auto-Fix Trailing Backslash (Clang Strictness Fix)
        run: |
          echo "Membersihkan spasi setelah backslash (\) di seluruh source code..."
          # Ini fix ampuh untuk error "backslash and newline separated by space" di Clang modern
          find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/\\[[:space:]]*$/\\/' {} +
          echo "✅ Pembersihan spasi backslash selesai!"

      - name: 🔧 Auto-Fix nohz_flags Error
        run: |
          echo "Mencoba memperbaiki error implicit declaration 'nohz_flags'..."
          python3 -c "
          import re
          try:
              with open('kernel/sched/core.c', 'r') as f:
                  content = f.read()
              content = re.sub(
                  r'(\s+)if \(!atomic_fetch_or\(NOHZ_KICK_MASK, nohz_flags\(cpu\)\)\)',
                  r'\1#ifdef CONFIG_NO_HZ_COMMON\n\1if (!atomic_fetch_or(NOHZ_KICK_MASK, nohz_flags(cpu)))\n\1#endif',
                  content
              )
              with open('kernel/sched/core.c', 'w') as f:
                  f.write(content)
              print('✅ Fix nohz_flags berhasil!')
          except FileNotFoundError:
              print('⚠️ File kernel/sched/core.c tidak ditemukan.')
          "

      - name: 🛡️ Setup KernelSU
        run: |
          echo "Mengunduh KernelSU v0.9.5..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: 🛡️ Apply SUSFS Patch
        run: |
          echo "Mengunduh patch SUSFS untuk kernel 4.19..."
          curl -sSL https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.19/kernel_patches/50_add_susfs_in_kernel-4.19.patch -o susfs.patch
          
          if patch -p1 --fuzz=3 --ignore-whitespace < susfs.patch; then
              echo "✅ Patch SUSFS berhasil diterapkan!"
          else
              echo "❌ Patch SUSFS gagal. Generate reject files..."
              patch -p1 --reject-file=- < susfs.patch || true
              find . -name "*.rej" -type f > reject_files.txt
              cat reject_files.txt
              exit 1
          fi

      - name: 📦 Upload Reject Files (Jika Gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SUSFS_Patch_Reject_Files
          path: |
            *.rej
            reject_files.txt
            susfs.patch

      - name: ⚙️ Enable KSU & SUSFS in Defconfig
        run: |
          echo "Mengaktifkan CONFIG_KSU dan CONFIG_KSU_SUSFS..."
          if [ -f "${{ inputs.defconfig }}" ]; then
              ./scripts/config --file ${{ inputs.defconfig }} --enable KSU
              ./scripts/config --file ${{ inputs.defconfig }} --enable KSU_SUSFS
              echo "✅ Konfigurasi berhasil!"
          else
              echo "❌ File defconfig tidak ditemukan!"
              exit 1
          fi

      - name: 🚀 Build Kernel
        run: |
          echo "Memulai proses compile kernel dengan Clang 18..."
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang-18
          export LD=ld.lld-18
          export AR=llvm-ar-18
          export NM=llvm-nm-18
          export OBJCOPY=llvm-objcopy-18
          export OBJDUMP=llvm-objdump-18
          export STRIP=llvm-strip-18
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          FULL_PATH="${{ inputs.defconfig }}"
          DEFCONFIG_NAME="${FULL_PATH#arch/arm64/configs/}"
          echo "Menggunakan defconfig untuk make: $DEFCONFIG_NAME"
          
          make -j$(nproc --all) O=out $DEFCONFIG_NAME
          make -j$(nproc --all) O=out

      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.device_name }}_KSU_SUSFS_Kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/**/*.dtb
