name: Kernel Build 4.4 RSK7 — KSU Fixed
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Repo Sumber (pemilik/nama)'
        required: true
        default: 'arazy79/asus_660_419'
      source_branch:
        description: 'Branch'
        required: true
        default: '4.4rsksvn'
      defconfig:
        description: 'Nama defconfig'
        required: true
        default: 'X00TD_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      CC: aarch64-linux-gnu-gcc
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      CCACHE_DIR: ${{ github.workspace }}/kernel/out/.ccache

    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_branch }}
          path: kernel
          fetch-depth: 1
          submodules: false

      - name: Tarik KernelSU + Buat Symlink
        run: |
          cd kernel
          git submodule update --init --force KernelSU
          
          # Hapus dulu kalau sudah ada
          rm -rf drivers/kernelsu
          # Buat symlink yang BENAR
          mkdir -p drivers
          ln -s "$(pwd)/KernelSU/kernel" drivers/kernelsu
          
          echo "✅ Symlink dibuat"
          ls -la drivers/kernelsu/

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            kernel/out/.ccache
            kernel/out
          key: rsk7-build-${{ inputs.source_branch }}-${{ inputs.defconfig }}
          restore-keys: |
            rsk7-build-${{ inputs.source_branch }}-
            rsk7-build-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev \
            lib32z1-dev liblz4-tool zip zlib1g-dev lzop rsync

      - name: Make Defconfig
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out ${{ inputs.defconfig }}
          
          echo "=== STATUS KSU ==="
          grep CONFIG_KSU out/.config
          echo "=== STATUS SUSFS ==="
          grep CONFIG_SUSFS out/.config

      - name: Cek KernelSU Sebelum Build
        working-directory: kernel
        run: |
          echo "=== Isi drivers/kernelsu ==="
          ls -la drivers/kernelsu/
          echo "=== Cek KSU di .config ==="
          grep -E "^CONFIG_KSU" out/.config || echo "❌ KSU TIDAK AKTIF!"
          echo "=== Cek drivers/kernelsu/Kconfig ==="
          ls -la drivers/kernelsu/Kconfig || echo "❌ Kconfig hilang!"
          echo "=== Cek drivers/kernelsu/Makefile ==="
          ls -la drivers/kernelsu/Makefile || echo "❌ Makefile hilang!"

      - name: Build Kernel
        working-directory: kernel
        run: |
          export CC="ccache ${{ env.CC }}"
          make ARCH=${{ env.ARCH }} O=out \
            CROSS_COMPILE="${{ env.CROSS_COMPILE }}" \
            CROSS_COMPILE_ARM32="${{ env.CROSS_COMPILE_ARM32 }}" \
            KCFLAGS="-Wno-error" \
            -j$(nproc)

      - name: Gabung DTB → Image.gz-dtb
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out dtbs
          DTB=$(find out/arch/arm64/boot/dts -name "*x00td*.dtb" -o -name "sdm636.dtb" -o -name "sdm660.dtb" | head -1)
          if [ -z "$DTB" ]; then echo "❌ DTB tidak ketemu"; exit 1; fi
          cat out/arch/arm64/boot/Image.gz "$DTB" > out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Upload Hasil
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSK7-${{ inputs.defconfig }}-${{ github.run_id }}
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          
