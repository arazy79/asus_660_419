name: Kernel Build 4.4 RSK7 — KSU Fixed
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Repo Sumber (pemilik/nama)'
        required: true
        default: 'rusakseven/RSKSevenProject-X00TD'
      source_branch:
        description: 'Branch yang mau dikompilasi'
        required: true
        default: 'rsk-4.4-clean2'
      defconfig:
        description: 'Nama defconfig'
        required: true
        default: 'X00TD_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      CC: aarch64-linux-gnu-gcc
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      CCACHE_DIR: ${{ github.workspace }}/kernel/out/.ccache

    steps:
      - name: Checkout Kernel — Dari input
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_branch }}
          path: kernel
          fetch-depth: 1
          submodules: false

      - name: Tarik KernelSU + Buat Symlink
        run: |
          cd kernel
          git submodule update --init --force KernelSU
          
          # Buat link → drivers/kernelsu
          mkdir -p drivers
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu
          
          echo "✅ KernelSU siap dipakai"
          ls -la drivers/kernelsu/
          [ -f drivers/kernelsu/Kconfig ] && echo "✅ Kconfig ditemukan" || echo "⚠️ Kconfig TIDAK ditemukan"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            kernel/out/.ccache
            kernel/out
          key: rsk7-build-${{ inputs.source_branch }}-${{ inputs.defconfig }}
          restore-keys: |
            rsk7-build-${{ inputs.source_branch }}-
            rsk7-build-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev \
            lib32z1-dev liblz4-tool zip zlib1g-dev lzop rsync

      - name: Make Defconfig
        working-directory: kernel
        run: |
          echo "Menggunakan defconfig: ${{ inputs.defconfig }}"
          make ARCH=${{ env.ARCH }} O=out ${{ inputs.defconfig }}
          echo "=== Status KSU & SuSFS ==="
          grep CONFIG_KSU out/.config || echo "⚠️ KernelSU TIDAK AKTIF!"
          grep CONFIG_SUSFS out/.config || echo "⚠️ SuSFS TIDAK AKTIF!"

      - name: Build Kernel
        working-directory: kernel
        run: |
          export CC="ccache ${{ env.CC }}"
          make ARCH=${{ env.ARCH }} O=out \
            CROSS_COMPILE="${{ env.CROSS_COMPILE }}" \
            CROSS_COMPILE_ARM32="${{ env.CROSS_COMPILE_ARM32 }}" \
            KCFLAGS="-Wno-error" \
            -j$(nproc)

      - name: Gabung DTB → Image.gz-dtb
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out dtbs
          DTB=$(find out/arch/arm64/boot/dts -name "*x00td*.dtb" -o -name "sdm636.dtb" -o -name "sdm660.dtb" | head -1)
          if [ -z "$DTB" ]; then echo "❌ DTB tidak ketemu"; exit 1; fi
          echo "Menggabungkan dengan DTB: $DTB"
          cat out/arch/arm64/boot/Image.gz "$DTB" > out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Upload Hasil
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSK7-${{ inputs.defconfig }}-${{ github.run_id }}
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
