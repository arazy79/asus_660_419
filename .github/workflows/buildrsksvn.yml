name: Kernel Build 4.4 RSK7 — All Defconfig Fixed
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Repo Sumber'
        required: true
        default: 'arazy79/asus_660_419'
      source_branch:
        description: 'Branch'
        required: true
        default: '4.4rsksvn'
      defconfig:
        description: 'Defconfig (nama file di arch/arm64/configs)'
        required: true
        default: 'X00TD_susfs_oc_defconfig'
      ksu_dir:
        description: 'Opsional: paksa folder KSU (contoh: KernelSU-Next-v320). Kosong = otomatis'
        required: false
        default: ''
      ksu_repo:
        description: 'Opsional: repo KSU fallback (user/repo) kalau tidak ada folder KSU valid'
        required: false
        default: ''
      ksu_branch:
        description: 'Opsional: branch KSU fallback'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      CCACHE_DIR: /home/runner/.ccache
      CONFIG_DIR: arch/arm64/configs
      LOG_DIR: /home/runner/work/logs

    steps:
      - name: Siapkan Folder Log
        run: mkdir -p "$LOG_DIR"

      - name: Clone Kernel
        env:
          REPO: ${{ inputs.source_repo }}
          BRANCH: ${{ inputs.source_branch }}
        run: |
          REPO="$(echo "$REPO" | xargs)"
          BRANCH="$(echo "$BRANCH" | xargs)"
          echo "Repo   : $REPO"
          echo "Branch : $BRANCH"
          git clone --depth=1 --single-branch --branch "$BRANCH" \
            "https://github.com/$REPO" kernel
          cd kernel
          git log -1 --oneline
          if [ -f .gitmodules ]; then
            echo "=== .gitmodules ==="
            cat .gitmodules
            echo "=== submodule update ==="
            git submodule update --init --recursive 2>&1 | tee "$LOG_DIR/submodule.log" \
              || echo "⚠️ submodule gagal (lihat pesan di atas)"
            echo "=== submodule status ==="
            git submodule status || true
          fi

      - name: Cek Defconfig
        working-directory: kernel
        env:
          INPUT_DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          NAME="$(echo "$INPUT_DEFCONFIG" | xargs)"
          NAME="${NAME#arch/arm64/configs/}"
          NAME="${NAME#./}"
          echo "DEFCONFIG=$NAME" >> "$GITHUB_ENV"

          echo "=== Defconfig terkait di $CONFIG_DIR ==="
          ls "$CONFIG_DIR" | grep -iE "x00td|susfs|ksu" || echo "(tidak ada yang cocok)"

          if [ ! -f "$CONFIG_DIR/$NAME" ]; then
            echo "❌ $CONFIG_DIR/$NAME tidak ditemukan"
            exit 1
          fi
          echo "✅ Pakai: $CONFIG_DIR/$NAME"
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_HAVE_KPROBES|CONFIG_OVERLAY_FS|APPENDED_DTB" "$CONFIG_DIR/$NAME" || echo "⚠️ tidak ada entri KSU di defconfig ini"

      - name: Siapkan KernelSU
        working-directory: kernel
        env:
          KSU_DIR: ${{ inputs.ksu_dir }}
          KSU_REPO: ${{ inputs.ksu_repo }}
          KSU_BRANCH: ${{ inputs.ksu_branch }}
        run: |
          echo "=== Folder KSU yang ada di repo ==="
          find . -maxdepth 2 -iname "kernelsu*" -not -path "./.git/*" -not -path "./out/*" | sort
          for d in KernelSU KernelSU-Next-v320 KernelSU-Next-v111 KernelSU-Next ksu; do
            if [ -d "$d" ]; then
              echo "--- $d ---"
              echo "isi:"; ls "$d" | head -15
              echo "kernel/ :"; ls "$d/kernel" 2>/dev/null | head -15 || echo "(tidak ada kernel/)"
            fi
          done

          echo "=== drivers/Kconfig & drivers/Makefile menyebut kernelsu? ==="
          grep -n kernelsu drivers/Kconfig drivers/Makefile || echo "⚠️ tidak ada referensi kernelsu di drivers/Kconfig / drivers/Makefile"

          NEED_SUSFS=0
          grep -q "^CONFIG_KSU_SUSFS=y" "$CONFIG_DIR/$DEFCONFIG" && NEED_SUSFS=1
          echo "Defconfig butuh SuSFS: $NEED_SUSFS"

          CAND="$(echo "$KSU_DIR" | xargs)"
          if [ -n "$CAND" ]; then
            echo "Pakai folder paksaan: $CAND"
            [ -f "$CAND/kernel/Kconfig" ] || { echo "❌ $CAND/kernel/Kconfig tidak ada"; exit 1; }
          else
            for d in KernelSU KernelSU-Next-v320 KernelSU-Next-v111 KernelSU-Next; do
              [ -f "$d/kernel/Kconfig" ] || { echo "skip $d (tidak ada kernel/Kconfig)"; continue; }
              if [ "$NEED_SUSFS" = 1 ] && ! grep -q "KSU_SUSFS" "$d/kernel/Kconfig"; then
                echo "skip $d (Kconfig tanpa KSU_SUSFS)"
                continue
              fi
              CAND="$d"
              break
            done
          fi

          KSU_REPO="$(echo "$KSU_REPO" | xargs)"
          KSU_BRANCH="$(echo "$KSU_BRANCH" | xargs)"
          if [ -z "$CAND" ] && [ -n "$KSU_REPO" ]; then
            echo "Clone KSU fallback: $KSU_REPO ($KSU_BRANCH)"
            rm -rf KernelSU-fallback
            if [ -n "$KSU_BRANCH" ]; then
              git clone --depth=1 --branch "$KSU_BRANCH" "https://github.com/$KSU_REPO" KernelSU-fallback
            else
              git clone --depth=1 "https://github.com/$KSU_REPO" KernelSU-fallback
            fi
            [ -f KernelSU-fallback/kernel/Kconfig ] && CAND="KernelSU-fallback"
          fi

          if [ -z "$CAND" ]; then
            echo "❌ Tidak ada folder KSU yang valid (butuh kernel/Kconfig$( [ "$NEED_SUSFS" = 1 ] && echo ' dengan KSU_SUSFS'))."
            echo "   Cek log submodule di step Clone, atau isi ksu_dir / ksu_repo."
            exit 1
          fi

          rm -rf drivers/kernelsu
          ln -sfn "../$CAND/kernel" drivers/kernelsu
          echo "✅ drivers/kernelsu -> ../$CAND/kernel"
          ls drivers/kernelsu | head -20

          echo "=== Cek symbol yang dipakai defconfig ada di Kconfig KSU ==="
          for s in $(grep -oE "^CONFIG_KSU[A-Z_]*" "$CONFIG_DIR/$DEFCONFIG" | sed 's/^CONFIG_//' | sort -u); do
            if grep -q "config $s\$" drivers/kernelsu/Kconfig; then
              echo "ok      $s"
            else
              echo "TIDAK ADA di Kconfig: $s"
            fi
          done

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex \
            libncurses-dev libssl-dev lib32z1-dev liblz4-tool zip \
            zlib1g-dev lzop rsync binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi

      - name: Restore Toolchain Cache
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: proton
          key: proton-clang-v1

      - name: Download Proton Clang
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang proton
          proton/bin/clang --version | head -1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ inputs.source_branch }}-${{ inputs.defconfig }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.source_branch }}-${{ inputs.defconfig }}-
            ccache-${{ inputs.source_branch }}-

      - name: Perbaiki Focaltech Firmware Hilang
        working-directory: kernel
        run: |
          FILE="drivers/input/touchscreen/focaltech_touch/focaltech_config.h"
          if [ -f "$FILE" ]; then
            sed -i 's|^#define FTS_UPGRADE_FW_FILE.*$|#define FTS_UPGRADE_FW_FILE ""|' "$FILE"
            echo "✅ FTS diperbaiki"
          fi

      - name: Make Defconfig
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/proton/bin:$PATH"
          set -o pipefail
          make ARCH=arm64 O=out \
            CC="ccache clang" \
            HOSTCC=gcc \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "$DEFCONFIG" 2>&1 | tee "$LOG_DIR/defconfig.log"
          echo "=== STATUS .config hasil ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_HAVE_KPROBES|CONFIG_OVERLAY_FS|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE" out/.config || echo "⚠️ config KSU tidak ketemu"

      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/proton/bin:$PATH"
          ccache -M 3G
          set -o pipefail
          make ARCH=arm64 O=out \
            CC="ccache clang" \
            HOSTCC=gcc \
            HOSTCFLAGS="-Wall -O2 -fomit-frame-pointer -std=gnu89 -fcommon" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            -j$(nproc) 2>&1 | tee "$LOG_DIR/build.log"
          ccache -s

      - name: Siapkan Image.gz-dtb
        working-directory: kernel
        run: |
          BOOT=out/arch/arm64/boot
          if [ -f "$BOOT/Image.gz-dtb" ]; then
            echo "✅ Image.gz-dtb dibuat oleh kernel"
          else
            echo "Image.gz-dtb tidak ada, gabung manual semua DTB"
            [ -f "$BOOT/Image.gz" ] || { echo "❌ Image.gz tidak ada"; exit 1; }
            DTBS=$(find $BOOT/dts -name "*.dtb" | sort)
            [ -n "$DTBS" ] || { echo "❌ DTB tidak ketemu"; exit 1; }
            cat $BOOT/Image.gz $DTBS > $BOOT/Image.gz-dtb
          fi
          ls -lh $BOOT/Image.gz-dtb

      - name: Upload Hasil
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSK7-${{ inputs.defconfig }}-${{ github.run_id }}
          path: kernel/out/arch/arm64/boot/Image.gz-dtb

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: /home/runner/work/logs
          if-no-files-found: ignore
