name: Kernel Build 4.4 RSK7
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig'
        required: true
        default: 'X00TD_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      CC: aarch64-linux-gnu-gcc    # ← Pakai GCC murni, gak campur Clang
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      CCACHE_DIR: ${{ github.workspace }}/kernel/out/.ccache

    steps:
      - name: Checkout Kernel 4.4 — SUMBER BENAR
        uses: actions/checkout@v4
        with:
          repository: rusakseven/RSKSevenProject-X00TD  # ← UBAH KE SINI
          ref: rsk-4.4-clean2                            # ← Branch bener
          path: kernel
          fetch-depth: 1
          submodules: recursive                         # ✅ KernelSU ikut

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            kernel/out/.ccache
            kernel/out
          key: rsk7-build-${{ github.run_id }}
          restore-keys: |
            rsk7-build-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libncurses-dev \
            lib32z1-dev liblz4-tool zip zlib1g-dev lzop rsync

      - name: Cek File & KernelSU
        run: |
          ls -la kernel/
          echo "=== Cek KernelSU ==="
          ls -la kernel/KernelSU* || echo "Cek submodule..."
          echo "=== Cek Defconfig ==="
          ls kernel/arch/arm64/configs/X00TD_defconfig || echo "Tidak ada!"

      - name: Prepare Output
        run: mkdir -p kernel/out

      - name: Make Defconfig — CARA BENAR
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out ${{ inputs.defconfig }}
          echo "✅ Defconfig selesai"
          echo "=== KernelSU Status ==="
          grep CONFIG_KSU out/.config || echo "⚠️ KernelSU TIDAK AKTIF!"
          echo "=== SuSFS Status ==="
          grep CONFIG_SUSFS out/.config || echo "⚠️ SuSFS TIDAK AKTIF!"

      - name: Build Kernel — GCC MURNI
        working-directory: kernel
        run: |
          export CC="ccache ${{ env.CC }}"
          make ARCH=${{ env.ARCH }} O=out \
            CROSS_COMPILE="${{ env.CROSS_COMPILE }}" \
            CROSS_COMPILE_ARM32="${{ env.CROSS_COMPILE_ARM32 }}" \
            KCFLAGS="-Wno-error" \
            -j$(nproc)
          echo "✅ Build selesai!"

      - name: Gabung DTB → Image.gz-dtb
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out dtbs
          DTB=$(find out/arch/arm64/boot/dts -name "*x00td*.dtb" -o -name "sdm636.dtb" -o -name "sdm660.dtb" | head -1)
          if [ -z "$DTB" ]; then echo "❌ DTB tidak ketemu"; exit 1; fi
          cat out/arch/arm64/boot/Image.gz "$DTB" > out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Upload Hasil
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSK7-X00TD-KSU-SUSFS-${{ github.run_id }}
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
