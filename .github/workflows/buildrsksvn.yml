name: Kernel Build 4.4 RSK7 — Final Fixed
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Repo Sumber'
        required: true
        default: 'arazy79/asus_660_419'
      source_branch:
        description: 'Branch'
        required: true
        default: '4.4rsksvn'
      defconfig:
        description: 'Defconfig'
        required: true
        default: 'X00TD_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      CC: aarch64-linux-gnu-gcc
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      CCACHE_DIR: ${{ github.workspace }}/kernel/out/.ccache

    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_branch }}
          path: kernel
          fetch-depth: 1
          submodules: false

      - name: Tarik KernelSU + Buat Symlink
        run: |
          cd kernel
          git submodule update --init --force KernelSU
          rm -rf drivers/kernelsu
          mkdir -p drivers
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu
          echo "✅ KernelSU siap"

      - name: Perbaiki Focaltech Firmware Hilang
        working-directory: kernel
        run: |
          if [ ! -f include/firmware/fw_sample.i ]; then
            echo "⚠️ fw_sample.i tidak ditemukan — menonaktifkan referensi..."
            sed -i 's|^#define FTS_UPGRADE_FW_FILE.*$|#define FTS_UPGRADE_FW_FILE ""|' \
              drivers/input/touchscreen/focaltech_touch/focaltech_config.h
            echo "✅ Focaltech diperbaiki"
          fi

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            kernel/out/.ccache
            kernel/out
          key: rsk7-build-${{ inputs.source_branch }}-${{ inputs.defconfig }}
          restore-keys: |
            rsk7-build-${{ inputs.source_branch }}-
            rsk7-build-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev \
            lib32z1-dev liblz4-tool zip zlib1g-dev lzop rsync

      - name: Make Defconfig
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out ${{ inputs.defconfig }}
          
          echo "=== STATUS KSU ==="
          grep CONFIG_KSU out/.config || echo "⚠️ Cek KSU"
          grep CONFIG_KSU_SUSFS out/.config || echo "⚠️ Cek KSU_SUSFS"
          echo "Defconfig selesai ✅"

      - name: Build Kernel
        working-directory: kernel
        run: |
          export CC="ccache ${{ env.CC }}"
          make ARCH=${{ env.ARCH }} O=out \
            CROSS_COMPILE="${{ env.CROSS_COMPILE }}" \
            CROSS_COMPILE_ARM32="${{ env.CROSS_COMPILE_ARM32 }}" \
            KCFLAGS="-Wno-error" \
            -j$(nproc)

      - name: Gabung DTB → Image.gz-dtb
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out dtbs
          DTB=$(find out/arch/arm64/boot/dts -name "*x00td*.dtb" -o -name "sdm636.dtb" -o -name "sdm660.dtb" | head -1)
          if [ -z "$DTB" ]; then echo "❌ DTB tidak ketemu"; exit 1; fi
          cat out/arch/arm64/boot/Image.gz "$DTB" > out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Upload Hasil
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RSK7-${{ inputs.defconfig }}-${{ github.run_id }}
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
