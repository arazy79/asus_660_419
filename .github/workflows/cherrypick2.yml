name: Cherry-pick by judul commit 2

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'URL repo sumber'
        required: true
        default: 'https://github.com/SonicBSV/android_kernel_asus_sdm660-4.19'
      source_branch:
        description: 'Branch di repo sumber'
        required: true
        default: 'lineage-23.2'
      target_branch:
        description: 'Branch basis di repo ini'
        required: true
        default: 'lineage-23.2'
      new_branch:
        description: 'Nama branch hasil'
        required: true
        default: 'camera-tes'

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Cherry-pick
        env:
          SRC_REPO: ${{ inputs.source_repo }}
          SRC_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          NEW_BRANCH: ${{ inputs.new_branch }}
        run: |
          set +e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          T="$RUNNER_TEMP"
          SRC_REF="refs/remotes/src/pick"

          # Baca daftar judul
          sed 's/\r$//; s/^[[:space:]]*//; s/[[:space:]]*$//' .github/pick-list.txt | awk 'NF' > "$T/titles.txt"
          echo "Baris di daftar: $(wc -l < "$T/titles.txt")"

          # Fetch source
          git remote add src "$SRC_REPO" 2>/dev/null || git remote set-url src "$SRC_REPO"
          git fetch --no-tags --filter=blob:none src "$SRC_BRANCH:$SRC_REF"
          git checkout -B "$NEW_BRANCH" "origin/$TARGET_BRANCH"

          # Map judul -> SHA
          git log --format='%H%x09%s' "$SRC_REF" > "$T/subjects.tsv"
          : > "$T/shas.txt"
          while IFS= read -r t; do
            sha=$(TITLE="$t" awk -F'\t' '$2==ENVIRON["TITLE"] {print $1; exit}' "$T/subjects.tsv")
            [ -n "$sha" ] && echo "$sha" >> "$T/shas.txt"
          done < "$T/titles.txt"

          sort -u "$T/shas.txt" > "$T/want.txt"
          echo "Judul cocok di sumber: $(wc -l < "$T/want.txt")"

          # Urutkan sesuai urutan asli di source (terlama dulu)
          git rev-list --reverse --topo-order "$SRC_REF" | grep -Fxf "$T/want.txt" > "$T/order.txt" 2>/dev/null || true
          if [ ! -s "$T/order.txt" ]; then
            echo "Nggak ada judul yang cocok. Cek branch sumber / isi pick-list.txt"
            exit 1
          fi

          picked=0; skipped=0; conflicts=0
          while read -r sha; do
            title=$(git log -1 --format=%s "$sha" 2>/dev/null)
            [ -z "$title" ] && continue

            # Skip merge commit (butuh -m, bikin exit 128)
            parents=$(git rev-list --parents -n 1 "$sha" | wc -w)
            if [ "$parents" -gt 2 ]; then
              echo "MERGE_SKIP ${sha:0:10} $title"
              skipped=$((skipped+1))
              continue
            fi

            if git cherry-pick -x "$sha" >/dev/null 2>&1; then
              echo "OK         ${sha:0:10} $title"
              picked=$((picked+1))
            elif [ -f .git/CHERRY_PICK_HEAD ]; then
              if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                git cherry-pick --skip >/dev/null 2>&1 || true
                echo "SUDAH ADA  ${sha:0:10} $title"
                skipped=$((skipped+1))
              else
                files=$(git diff --name-only --diff-filter=U)
                git cherry-pick --abort >/dev/null 2>&1 || true
                echo "KONFLIK    ${sha:0:10} $title"
                echo "$files" | sed 's/^/            file: /'
                conflicts=$((conflicts+1))
              fi
            else
              echo "GAGAL      ${sha:0:10} $title (gagal mulai, skip)"
              skipped=$((skipped+1))
            fi
          done < "$T/order.txt"

          # Sync folder flash UTUH dari source (anti Makefile corrupt)
          FLASH_PATH="drivers/media/platform/msm/camera_v2/sensor/flash"
          if git cat-file -e "$SRC_REF:$FLASH_PATH" 2>/dev/null; then
            git checkout "$SRC_REF" -- "$FLASH_PATH"/ 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "camera_v2: sync sensor/flash dari sonic (overwrite utuh)" >/dev/null 2>&1 || true
              echo "SYNC flash folder OK"
              picked=$((picked+1))
            fi
          fi

          echo "Selesai: $picked masuk, $skipped skip, $conflicts konflik"

          # Summary
          {
            echo "### Hasil cherry-pick"
            echo "- masuk: $picked"
            echo "- skip: $skipped"
            echo "- konflik: $conflicts"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$picked" -gt 0 ]; then
            git push origin "$NEW_BRANCH" --force
            echo "PUSHED ke $NEW_BRANCH"
          else
            echo "Nggak ada yang masuk, nggak push."
            exit 1
          fi
