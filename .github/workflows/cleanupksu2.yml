name: Cleanup KernelSU 2

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Repo target (owner/name). Kosongkan = repo ini sendiri'
        required: false
        default: 'arazy79/asus_660_419'
        type: string

      target_branch:
        description: 'Branch target (contoh: 4.4rsksvn)'
        required: true
        default: '4.4rsksvn'
        type: string

      push_changes:
        description: 'Push hasil cleanup ke branch target?'
        required: true
        default: true
        type: boolean

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # PENTING: izin push
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo != '' && inputs.target_repo || github.repository }}
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Hapus folder KernelSU & sisa lama
        run: |
          set -e
          echo "=== Cek apa yang ada ==="
          if [ -d KernelSU ]; then
            ls -ld KernelSU
          else
            echo "Folder KernelSU tidak ada (skip)"
          fi

          echo "=== Hapus folder KernelSU ==="
          rm -rf KernelSU

          echo "=== Bersihkan Makefile ==="
          sed -i '/kernelsu/d' drivers/Makefile 2>/dev/null || true

          echo "=== Bersihkan Kconfig ==="
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig 2>/dev/null || true

          echo "=== Status perubahan ==="
          git status
          git diff

      - name: Commit & Push
        if: ${{ inputs.push_changes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "✅ Tidak ada perubahan — sudah bersih"
          else
            git commit -m "Cleanup: hapus folder KernelSU & sisa lama"
            git push origin HEAD:${{ inputs.target_branch }}
            echo "✅ Berhasil di-push ke ${{ inputs.target_branch }}!"
          fi
