name: Cleanup KernelSU 2

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Repo target (owner/name). Kosongkan = repo ini sendiri'
        required: false
        default: 'arazy79/asus_660_419'
        type: string
      target_branch:
        description: 'Branch target (contoh: 4.4rsksvn)'
        required: true
        default: '4.4rsksvn'
        type: string
      push_changes:
        description: 'Push hasil cleanup ke branch target?'
        required: true
        default: true
        type: boolean

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo != '' && inputs.target_repo || github.repository }}
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Hapus folder KernelSU, KernelSU-Next, dan Symlink
        run: |
          set -e
          echo "=== Sebelum dihapus ==="
          ls -la | grep -i kernelsu || echo "Tidak ada folder KernelSU"
          
          echo "=== Hapus folder KernelSU & KernelSU-Next ==="
          rm -rf KernelSU
          rm -rf KernelSU-Next-*
          
          echo "=== Hapus symlink/file yang mengandung nama KernelSU ==="
          # Ini buat ngehapus symlink aneh yang ada panahnya
          find . -maxdepth 1 -iname "*kernelsu*" -exec rm -rf {} + || true
          
          echo "=== Bersihkan Makefile ==="
          sed -i '/kernelsu/d' drivers/Makefile 2>/dev/null || true
          
          echo "=== Bersihkan Kconfig ==="
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig 2>/dev/null || true
          
          echo "=== Status perubahan ==="
          git status
          git diff

      - name: Commit & Push
        if: ${{ inputs.push_changes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "✅ Tidak ada perubahan — sudah bersih"
          else
            git commit -m "Cleanup: hapus folder KernelSU, Next, & symlink"
            git push origin HEAD:${{ inputs.target_branch }}
            echo "✅ Berhasil di-push ke ${{ inputs.target_branch }}!"
          fi
