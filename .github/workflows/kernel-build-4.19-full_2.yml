name: Kernel Build X00TD 4.19 skywalker KSUUUUUUUUU 2222
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository kernel (format owner/repo, JANGAN full URL). Kosongkan = pakai default arazy79/android-kernel-tes-4.19'
        required: false
        default: 'arazy79/asus_660_419'
      branch:
        description: 'Branch / tag / commit yang di-checkout'
        required: true
        default: 'a16-fastcharge'
      defconfig:
        description: 'Defconfig path (relatif dari arch/arm64/configs/)'
        required: true
        default: 'X00TD_defconfig'
      toolchain:
        description: 'Toolchain: default = clang+binutils bawaan Ubuntu (seperti biasa) | llvm = Neutron clang 24 | gcc = EVA GCC'
        type: choice
        default: 'llvm'
        options:
          - default
          - llvm
          - gcc
      kcflags_w:
        description: 'Enable KCFLAGS=-w (tekan semua warning)'
        type: boolean
        default: false
      enable_ksu:
        description: 'Enable KernelSU (centang = ON)'
        type: boolean
        default: true
      enable_susfs:
        description: 'Enable SuSFS (butuh KSU ON; fork harus bakasu atau sukisu)'
        type: boolean
        default: true
      ksu_fork:
        description: 'Fork KernelSU (manager harus dari fork yang sama). backslashxx hanya untuk SuSFS OFF'
        type: choice
        default: 'bakasu'
        options:
          - bakasu
          - sukisu
          - backslashxx
      bakasu_ref:
        description: 'Ref BakaSU (branch/tag/SHA), cuma dipakai kalau fork = bakasu. Default main (branch sync-susfs sudah dihapus upstream). Kalau sudah sukses, pin ke SHA'
        required: true
        default: 'd5e9e025b8b49155f8014684d64c91742b465f65'
      sukisu_ref:
        description: 'Ref SukiSU-Ultra (branch/tag/SHA), cuma dipakai kalau fork = sukisu. Default = commit terakhir yang patch fix SukiSU dari builder masih bisa apply (21 Okt). builtin terbaru sudah bentrok'
        required: true
        default: '0165c0556929f1b509a9b632a46ef09b67a7940e'
      builder_ref:
        description: 'Ref repo JackA1ltman/NonGKI_Kernel_Build_2nd (branch/tag/SHA). Kalau sudah sukses, pin ke SHA biar bisa diulang persis'
        required: true
        default: 'mainline'
      ksu_debug:
        description: 'Enable CONFIG_KSU_DEBUG (default mati; fork KSU biasanya default-nya ON)'
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      CC: clang
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      CCACHE_DIR: ${{ github.workspace }}/kernel/out/.ccache
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo || 'arazy79/android-kernel-tes-4.19' }}
          ref: ${{ github.event.inputs.branch || 'fastcharge-test' }}
          path: kernel
          submodules: recursive
      - name: Apply close_range backport (fix netd posix_spawn / hotspot)
        working-directory: kernel
        run: |
          if [ ! -f close_range_backport.patch ]; then
            echo "::error::close_range_backport.patch tidak ada di root repo (branch ${{ github.event.inputs.branch || 'fastcharge-test' }})"
            exit 1
          fi
          if git apply -R --check close_range_backport.patch 2>/dev/null; then
            echo "close_range backport sudah ter-apply di source, skip"
          else
            git apply --check close_range_backport.patch
            git apply close_range_backport.patch
            echo "close_range backport applied"
          fi
          echo "=== cek hasil ==="
          grep -n "SYSCALL_DEFINE3(close_range" fs/open.c
          grep -n "__NR_close_range\|define __NR_syscalls" include/uapi/asm-generic/unistd.h
      - name: Setup KernelSU
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        env:
          ENABLE_SUSFS: ${{ github.event.inputs.enable_susfs }}
          KSU_FORK: ${{ github.event.inputs.ksu_fork }}
          BAKASU_REF: ${{ github.event.inputs.bakasu_ref }}
          SUKISU_REF: ${{ github.event.inputs.sukisu_ref }}
        run: |
          case "$KSU_FORK" in
            sukisu)
              KSU_URL="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/main/kernel/setup.sh"
              KSU_BRANCH="${SUKISU_REF}"
              KSU_REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra"
              ;;
            bakasu)
              # Blokir SuSFS ($(error Please wait susfs update)) sudah dicabut di main (16 Okt),
              # dan branch sync-susfs sudah dihapus upstream. Ref bisa branch/tag/SHA lewat input bakasu_ref.
              KSU_URL="https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_REF}/kernel/setup.sh"
              KSU_BRANCH="${BAKASU_REF}"
              KSU_REPO="https://github.com/Baka-SU/BakaSU"
              ;;
            backslashxx)
              if [ "$ENABLE_SUSFS" = "true" ]; then
                echo "::error::backslashxx tidak dipakai untuk SuSFS di workflow ini, pilih bakasu/sukisu atau matikan SuSFS"
                exit 1
              fi
              KSU_URL="https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh"
              KSU_BRANCH="master"
              KSU_REPO="https://github.com/backslashxx/KernelSU"
              ;;
            *)
              echo "::error::fork tidak dikenal: $KSU_FORK"
              exit 1
              ;;
          esac
          echo "::group::KernelSU setup"
          echo "KSU script : $KSU_URL"
          echo "KSU branch : $KSU_BRANCH"
          # -f: kalau 404, curl gagal beneran (dulu isi "404: Not Found" ikut dijalankan bash)
          if ! curl -fLSs --retry 3 --retry-delay 2 -o /tmp/ksu_setup.sh "$KSU_URL"; then
            echo "::error::gagal download setup.sh KernelSU dari $KSU_URL (ref/branch mungkin sudah dihapus atau diganti nama)"
            echo "Branch yang ada sekarang di $KSU_REPO:"
            git ls-remote --heads "$KSU_REPO" | sed 's#.*refs/heads/#  - #' | head -30 || true
            exit 1
          fi
          bash /tmp/ksu_setup.sh "$KSU_BRANCH"
          # tampilkan commit KernelSU yang kepakai, biar gampang di-pin lewat bakasu_ref
          if [ -d KernelSU ]; then
            KSU_SHA="$(git -C KernelSU rev-parse HEAD)"
            echo "KSU commit : $KSU_SHA"
            echo "::notice::KSU commit yang dipakai: $KSU_SHA (isi bakasu_ref dengan ini buat pin)"
          fi
          echo "--- drivers/kernelsu ---"
          ls -la drivers/kernelsu || true
          echo "--- Makefile / Kconfig hook ---"
          grep -n kernelsu drivers/Makefile drivers/Kconfig || true
          echo "::endgroup::"
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "::error::drivers/kernelsu/Kconfig tidak ada, setup KernelSU gagal"
            exit 1
          fi
      - name: KernelSU compat fixes for kernel 4.4
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        run: |
          # semua sed di sini aman kalau pola tidak ketemu (no-op).
          # Kalau compile masih error di file KSU, kirim log errornya, tambah fix di sini.
          KFILES=$(find -L drivers/kernelsu -type f \( -name '*.c' -o -name '*.h' \))
          # C99/C11 syntax di kernel 4.4 yang default gnu89
          for mk in drivers/kernelsu/Kbuild drivers/kernelsu/Makefile; do
            if [ -f "$mk" ] && ! grep -q 'std=gnu11' "$mk"; then
              echo 'ccflags-y += -std=gnu11' >> "$mk"
              echo "gnu11 ditambah ke $mk"
              break
            fi
          done
          # MODULE_IMPORT_NS (kernel < 5.4)
          sed -i --follow-symlinks '/MODULE_IMPORT_NS/d' $KFILES
          # compiler_types.h (kernel < 4.15)
          sed -i --follow-symlinks 's|#include <linux/compiler_types.h>|#include <linux/compiler.h>|' $KFILES
          # task_stack.h (kernel < 4.11)
          sed -i --follow-symlinks '/#include <linux\/sched\/task_stack.h>/d' $KFILES
          # full_name_hash 2 argumen (kernel < 4.17)
          sed -i --follow-symlinks 's/full_name_hash(NULL, dirpath, strlen(dirpath))/full_name_hash((const unsigned char *)dirpath, strlen(dirpath))/' $KFILES
          # group_info pakai blocks[] di 4.4
          sed -i --follow-symlinks 's/group_info->gid\[i\]/group_info->blocks[i]/' $KFILES
          # security_add_hooks 2 argumen di 4.4
          sed -i --follow-symlinks 's/security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu")/security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks))/' $KFILES
          # <linux/static_call.h> baru ada di kernel 5.10+, tapi SukiSU meng-include-nya tanpa syarat.
          # Stub ini bikin static_call jadi function pointer biasa (hasil kerjanya sama). Cuma dibuat kalau headernya tidak ada.
          if [ ! -f include/linux/static_call.h ]; then
            cat > include/linux/static_call.h <<'EOF'
          #ifndef _KSU_STATIC_CALL_STUB_H
          #define _KSU_STATIC_CALL_STUB_H
          #define DECLARE_STATIC_CALL(name, func) extern typeof(func) *__ksu_sc_##name
          #define DEFINE_STATIC_CALL(name, func) typeof(func) *__ksu_sc_##name = (func)
          #define static_call(name) (*__ksu_sc_##name)
          #define static_call_update(name, func) ((void)(__ksu_sc_##name = (func)))
          #endif
          EOF
            echo "stub include/linux/static_call.h dibuat (kernel < 5.10)"
          fi
          echo "compat fixes selesai"
      - name: Apply SuSFS kernel patch + inline hooks
        if: ${{ github.event.inputs.enable_ksu == 'true' && github.event.inputs.enable_susfs == 'true' }}
        working-directory: kernel
        env:
          KSU_FORK: ${{ github.event.inputs.ksu_fork }}
        run: |
          set -e
          BUILDER=/tmp/builder/Patches
          # 1) patch kernel SuSFS: prioritas file di root repo kamu (kayak susfs_x00td_419.patch di 4.19)
          PATCH=""
          if [ -f susfs_x00td_44.patch ]; then
            PATCH="$PWD/susfs_x00td_44.patch"
            echo "Pakai patch dari root repo: susfs_x00td_44.patch"
          elif [ -f "$BUILDER/Patch/susfs_patch_to_4.4.patch" ]; then
            PATCH="$BUILDER/Patch/susfs_patch_to_4.4.patch"
            echo "Pakai patch dari builder: Patches/Patch/susfs_patch_to_4.4.patch"
          fi
          if [ -z "$PATCH" ]; then
            echo "::error::susfs_patch_to_4.4.patch tidak ada di builder_ref ini. Isi Patches/Patch:"
            ls -la "$BUILDER/Patch" || true
            exit 1
          fi
          if git apply -R --check "$PATCH" 2>/dev/null; then
            echo "SuSFS kernel patch sudah ter-apply, skip"
          elif git apply --check "$PATCH" 2>/dev/null; then
            git apply --whitespace=nowarn "$PATCH"
            echo "SuSFS kernel patch applied (git apply)"
          else
            echo "git apply gagal, coba patch -p1 dengan fuzz..."
            rc=0
            patch -p1 -N -F3 --no-backup-if-mismatch < "$PATCH" || rc=$?
            if [ "$rc" -ne 0 ] || find . -name '*.rej' | grep -q .; then
              echo "::error::ada hunk SuSFS yang gagal, isi .rej di bawah (kirim ke Claude)"
              find . -name '*.rej' -print -exec cat {} \;
              exit 1
            fi
            echo "SuSFS kernel patch applied (patch -p1)"
          fi
          # 2) fix khusus SukiSU (dari builder)
          if [ "$KSU_FORK" = "sukisu" ]; then
            FIX="$BUILDER/Patch/sukisu_ultra_fixed.patch"
            if [ -f "$FIX" ]; then
              rm -rf /tmp/sfix && mkdir -p /tmp/sfix
              awk '/^diff --git /{n++} n>0{print > sprintf("/tmp/sfix/part%02d.p", n)}' "$FIX"
              (
                cd drivers/kernelsu
                for p in /tmp/sfix/part*.p; do
                  f=$(grep -m1 '^+++ ' "$p" | sed 's#^+++ [ab]/##')
                  if [ "$f" = "runtime/ksud.c" ]; then
                    sed -i -e '/ksu_selinux_hide_handle_post_fs_data();/d' -e '/ksu_selinux_hide_handle_second_stage();/d' runtime/ksud.c
                    echo "SukiSU fix applied (hapus panggilan selinux_hide): $f"
                    continue
                  fi
                  rc=0
                  out=$(patch -p1 -N < "$p" 2>&1) || rc=$?
                  if [ "$rc" -ne 0 ]; then
                    echo "::error::SukiSU fix patch gagal untuk $f"
                    echo "$out"
                    exit 1
                  fi
                  echo "SukiSU fix applied: $f"
                done
              )
            else
              echo "::warning::sukisu_ultra_fixed.patch tidak ada di builder, skip"
            fi
          fi
          # 3) inline hook
          cp "$BUILDER/susfs_inline_hook_patches.sh" ./susfs_inline_hook_patches.sh
          bash susfs_inline_hook_patches.sh ./ | tee /tmp/hook.log
          rm -f susfs_inline_hook_patches.sh
          if grep -qiE "failed|warning" /tmp/hook.log; then
            echo "::warning::script hook inline ngelaporin failed/warning, cek log di atas"
          fi
          # semua kekurangan dikumpulkan dulu, lalu gagal sekali, biar sekali run kelihatan semuanya
          MISSING=""
          for f in fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/input/input.c kernel/reboot.c; do
            grep -q "ksu_" "$f" || MISSING="$MISSING hook-ksu:$f"
          done
          # sys.c cuma di-hook kalau fork KSU punya ksu_handle_setresuid, jadi cuma warning
          grep -q "ksu_" kernel/sys.c || echo "::warning::kernel/sys.c tanpa hook ksu_handle_setresuid (normal kalau fork KSU tidak punya)"
          # patch kernel SuSFS memakai susfs_current_app_uid di fs/stat.c, include-nya cuma ditambah oleh script hook
          grep -q "susfs_def.h" fs/stat.c || MISSING="$MISSING include-susfs_def.h:fs/stat.c"
          grep -q "CONFIG_KSU_SUSFS" fs/namespace.c || MISSING="$MISSING susfs:fs/namespace.c"
          if [ -n "$MISSING" ]; then
            echo "::error::hook/patch belum lengkap:$MISSING"
            echo "--- log script hook ---"
            cat /tmp/hook.log
            exit 1
          fi
          echo "Step SuSFS selesai"
      - name: Apply manual hooks (KSU tanpa SuSFS)
        if: ${{ github.event.inputs.enable_ksu == 'true' && github.event.inputs.enable_susfs != 'true' }}
        working-directory: kernel
        run: |
          set -e
          cp /tmp/builder/Patches/syscall_hook_patches.sh ./syscall_hook_patches.sh
          bash syscall_hook_patches.sh ./ | tee /tmp/hook.log
          rm -f syscall_hook_patches.sh
          grep -qiE "failed|warning" /tmp/hook.log && echo "::warning::script hook ngelaporin failed/warning, cek log di atas" || true
      - name: Select toolchain
        id: tc
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
        run: |
          case "$TOOLCHAIN" in
            llvm)
              echo "dir=$HOME/neutron-clang" >> "$GITHUB_OUTPUT"
              echo "key=llvm-24-neutron-06092026" >> "$GITHUB_OUTPUT"
              echo "out_prefix=kernel-out-llvm-" >> "$GITHUB_OUTPUT"
              ;;
            gcc)
              echo "dir=$HOME/gcc-arm64" >> "$GITHUB_OUTPUT"
              echo "key=gcc-eva-arm64-06052026" >> "$GITHUB_OUTPUT"
              echo "out_prefix=kernel-out-gcc-" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "dir=" >> "$GITHUB_OUTPUT"
              echo "key=" >> "$GITHUB_OUTPUT"
              echo "out_prefix=kernel-build-" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "Toolchain dipilih: $TOOLCHAIN"
      - name: Restore ccache & build cache
        uses: actions/cache@v4
        with:
          path: |
            kernel/out/.ccache
            kernel/out
          key: ${{ steps.tc.outputs.out_prefix }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.tc.outputs.out_prefix }}
      - name: Cache toolchain
        id: tc_cache
        if: ${{ github.event.inputs.toolchain != 'default' }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.tc.outputs.dir }}
          key: ${{ steps.tc.outputs.key }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo apt-get install -y clang llvm lld
          sudo apt-get install -y zstd wget xz-utils
      - name: Fetch toolchain
        if: ${{ github.event.inputs.toolchain != 'default' && steps.tc_cache.outputs.cache-hit != 'true' }}
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
        run: |
          if [ "$TOOLCHAIN" = "llvm" ]; then
            echo "Downloading Neutron clang..."
            mkdir -p "$HOME/neutron-clang"
            wget -q "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst" -O /tmp/clang.tar.zst
            tar -xf /tmp/clang.tar.zst -C "$HOME/neutron-clang"
            rm -f /tmp/clang.tar.zst
            if [ ! -x "$HOME/neutron-clang/bin/clang" ]; then
              echo "::error::bin/clang tidak ada setelah extract Neutron"
              ls -la "$HOME/neutron-clang" || true
              exit 1
            fi
          else
            echo "Downloading EVA GCC..."
            cd "$HOME"
            wget -q "https://github.com/mvaisakh/gcc-build/releases/download/06052026/eva-gcc-arm64-06052026.xz" -O gcc.tar.xz
            tar -xf gcc.tar.xz
            rm -f gcc.tar.xz
            if [ ! -d "$HOME/gcc-arm64/bin" ]; then
              echo "::error::folder gcc-arm64/bin tidak ada setelah extract EVA GCC"
              ls -la "$HOME" || true
              exit 1
            fi
          fi
      - name: Setup toolchain environment
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
          KCFLAGS_W: ${{ github.event.inputs.kcflags_w }}
        run: |
          case "$TOOLCHAIN" in
            llvm)
              TC="$HOME/neutron-clang"
              echo "$TC/bin" >> "$GITHUB_PATH"
              echo "LD_LIBRARY_PATH=$TC/lib:$TC/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
              echo "TC_MAKE_ARGS=LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              ;;
            gcc)
              TC="$HOME/gcc-arm64"
              prefix=""
              for p in aarch64-linux-android- aarch64-linux-gnu- aarch64-elf- aarch64-linux-; do
                if [ -f "$TC/bin/${p}gcc" ]; then prefix="$p"; break; fi
              done
              if [ -z "$prefix" ]; then
                echo "::error::gcc aarch64 tidak ditemukan di $TC/bin"
                ls -la "$TC/bin" || true
                exit 1
              fi
              echo "$TC/bin" >> "$GITHUB_PATH"
              echo "TC_MAKE_ARGS=CROSS_COMPILE=$TC/bin/$prefix CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              ;;
            *)
              echo "TC_MAKE_ARGS=CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              ;;
          esac
          # KCFLAGS: default tetap -Wno-error (seperti sebelumnya); -w kalau dicentang.
          # Di mode gcc selalu -w (sama seperti env-gcc.sh di build action rsuntk).
          if [ "$KCFLAGS_W" = "true" ] || [ "$TOOLCHAIN" = "gcc" ]; then
            echo "TC_KCFLAGS=-w" >> "$GITHUB_ENV"
          else
            echo "TC_KCFLAGS=-Wno-error" >> "$GITHUB_ENV"
          fi
      - name: Debug - Check files
        run: |
          echo "=== Repo & branch ==="
          echo "Repo  : ${{ github.event.inputs.repo || 'arazy79/android-kernel-tes-4.19' }}"
          echo "Branch: ${{ github.event.inputs.branch || 'fastcharge-test' }}"
          echo "=== Kernel directory contents ==="
          ls -la kernel/
          echo "=== Defconfig exists? ==="
          ls -la kernel/arch/arm64/configs/vendor/asus/${{ github.event.inputs.defconfig }} || echo "FILE NOT FOUND!"
          echo "=== All defconfigs ==="
          ls -la kernel/arch/arm64/configs/
          echo "=== Toolchain ==="
          echo "TC_MAKE_ARGS=$TC_MAKE_ARGS"
          echo "TC_KCFLAGS=$TC_KCFLAGS"
      - name: Prepare output directory
        run: |
          mkdir -p kernel/out
      - name: Make defconfig
        working-directory: kernel
        env:
          ENABLE_KSU: ${{ github.event.inputs.enable_ksu }}
          ENABLE_SUSFS: ${{ github.event.inputs.enable_susfs }}
          DEFCONFIG_NAME: ${{ github.event.inputs.defconfig }}
          KSU_DEBUG: ${{ github.event.inputs.ksu_debug }}
        run: |
          set -e
          export PATH="$PATH${TC_BIN:+:$TC_BIN}"
          if [ -n "$TC_BIN" ]; then echo "clang dipakai: $(command -v clang) -> $(CCACHE_DISABLE=1 clang --version | head -1)"; fi
          DEFCONFIG_PATH=$(find arch/arm64/configs -name "$DEFCONFIG_NAME" | head -1)
          [ -z "$DEFCONFIG_PATH" ] && { echo "::error::$DEFCONFIG_NAME tidak ditemukan"; exit 1; }
          DEFCONFIG_REL="${DEFCONFIG_PATH#arch/arm64/configs/}"
          make ARCH=arm64 O=out $TC_MAKE_ARGS "$DEFCONFIG_REL"
          if [ "$ENABLE_KSU" = "true" ] && [ "$ENABLE_SUSFS" = "true" ]; then
            echo "KernelSU: ON + SuSFS"
            {
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
              echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
            } >> out/.config
          elif [ "$ENABLE_KSU" = "true" ]; then
            echo "KernelSU: ON (manual hook, tanpa SuSFS)"
            {
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_MANUAL_HOOK=y"
            } >> out/.config
          else
            echo "KernelSU: OFF"
          fi
          if [ "$ENABLE_KSU" = "true" ]; then
            if [ "$KSU_DEBUG" = "true" ]; then
              echo "CONFIG_KSU_DEBUG=y" >> out/.config
            else
              echo "# CONFIG_KSU_DEBUG is not set" >> out/.config
            fi
          fi
          # speed-up: debug info tidak ikut ke Image.gz-dtb, tapi bikin compile + link jauh lebih lama
          echo "# CONFIG_DEBUG_INFO is not set" >> out/.config
          make ARCH=arm64 O=out $TC_MAKE_ARGS olddefconfig
          echo "=== CONFIG_KSU* setelah olddefconfig ==="
          grep -n "CONFIG_KSU" out/.config || echo "(tidak ada)"
          grep -n "CONFIG_DEBUG_INFO" out/.config || true
      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$PATH${TC_BIN:+:$TC_BIN}"
          if [ -n "$TC_BIN" ]; then
            echo "clang dipakai: $(command -v clang) -> $(CCACHE_DISABLE=1 clang --version | head -1)"
            case "$(CCACHE_DISABLE=1 clang --version | head -1)" in
              *"clang version 13."*) ;;
              *) echo "::error::clang yang kepakai BUKAN Proton 13 (kemungkinan clang sistem runner)"; exit 1 ;;
            esac
          fi
          echo "CPU cores: $(nproc)"
          make ARCH=arm64 O=out $TC_MAKE_ARGS KCFLAGS="$TC_KCFLAGS" -j"$(nproc)" Image.gz dtbs
      - name: Pack Image.gz-dtb
        working-directory: kernel
        run: |
          DTB_PATH=""
          for pattern in "sdm636" "sdm660"; do
            FOUND=$(find out/arch/arm64/boot/dts -name "${pattern}*.dtb" | sort | head -1)
            if [ -n "$FOUND" ]; then
              DTB_PATH="$FOUND"
              echo "DTB selected: $DTB_PATH"
              break
            fi
          done
          if [ -z "$DTB_PATH" ]; then
            echo "=== Semua DTB ==="
            find out/arch/arm64/boot/dts -name "*.dtb" | sort
            echo "::error::No sdm636/sdm660 DTB found"
            exit 1
          fi
          [ ! -f out/arch/arm64/boot/Image.gz ] && { echo "::error::Image.gz missing"; exit 1; }
          cat out/arch/arm64/boot/Image.gz "$DTB_PATH" > out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb
      - name: Show compiler used
        working-directory: kernel
        continue-on-error: true
        run: |
          grep -E "LINUX_COMPILER|UTS_VERSION" out/include/generated/compile.h || true
      - name: Verify KernelSU di kernel hasil build
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        continue-on-error: true
        env:
          ENABLE_SUSFS: ${{ github.event.inputs.enable_susfs }}
        run: |
          grep -n "CONFIG_KSU" out/.config || true
          if grep -q "^CONFIG_KSU=y" out/.config && grep -qi "ksu" out/System.map; then
            echo "OK: CONFIG_KSU=y dan simbol ksu ada di System.map"
          else
            echo "::warning::CONFIG_KSU=y atau simbol ksu tidak ditemukan, KSU belum aktif di build ini"
            exit 1
          fi
          if [ "$ENABLE_SUSFS" = "true" ]; then
            if grep -q "^CONFIG_KSU_SUSFS=y" out/.config && grep -qi "susfs" out/System.map; then
              echo "OK: CONFIG_KSU_SUSFS=y dan simbol susfs ada di System.map"
            else
              echo "::warning::CONFIG_KSU_SUSFS=y atau simbol susfs tidak ditemukan, SuSFS belum aktif"
              exit 1
            fi
          fi
      - name: Build DTB + Image.gz-dtb
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out $TC_MAKE_ARGS dtbs
          echo "=== All DTB files ==="
          find out/arch/arm64/boot/dts -name "*.dtb" | sort
          # Cari DTB untuk X00TD
          DTB=$(find out/arch/arm64/boot/dts -iname "*x00td*.dtb" | head -1)
          # Kalau gak ada, coba sdm636.dtb
          if [ -z "$DTB" ]; then
            DTB=$(find out/arch/arm64/boot/dts -name "sdm636.dtb" | head -1)
          fi
          # Kalau masih gak ada, coba sdm660.dtb
          if [ -z "$DTB" ]; then
            DTB=$(find out/arch/arm64/boot/dts -name "sdm660.dtb" | head -1)
          fi
          if [ -z "$DTB" ]; then
            echo "ERROR: No DTB found! Build failed."
            exit 1
          fi
          echo "Using DTB: $DTB"
          cat out/arch/arm64/boot/Image.gz "$DTB" > out/arch/arm64/boot/Image.gz-dtb
          echo "=== Final size ==="
          ls -lh out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb
      - name: Check build result
        run: |
          ls -la kernel/out/arch/arm64/boot/
      - name: Debug CONFIG_KSU (on failure)
        if: ${{ failure() && github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        run: |
          grep -n "CONFIG_KSU" out/.config || echo "CONFIG_KSU tidak ada di out/.config"
      - name: Upload Image.gz-dtb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build-X00TD-SKYWALKER-4.19-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.enable_ksu == 'true' && (github.event.inputs.enable_susfs == 'true' && format('KSU-SUSFS-{0}', github.event.inputs.susfs_ksu_fork) || 'KSU') || 'NOKSU' }}-${{ github.run_id }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
