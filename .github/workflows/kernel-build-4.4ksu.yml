name: Build RSKSeven X00TD 4.4 (KSU Next + SuSFS built-in)
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig (relatif dari arch/arm64/configs/)'
        required: true
        default: 'X00TD_defconfig'
      toolchain:
        description: 'Toolchain: gcc (disarankan untuk 4.4) | default | llvm'
        type: choice
        default: 'gcc'
        options: [gcc, default, llvm]
      ksu_repo:
        description: 'Sumber KernelSU-Next (harus punya dukungan SUSFS v2)'
        required: true
        default: 'https://github.com/Sidex15/KernelSU-Next'
      ksu_branch:
        description: 'Branch/tag KSU Next legacy + SUSFS v2'
        required: true
        default: 'legacy-susfs-v2'
      ksu_dir:
        description: 'Nama folder KSU (harus sama dengan target symlink drivers/kernelsu)'
        required: true
        default: 'KernelSU-Next-v320'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      CC: clang
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: rusakseven/RSKSevenProject-X00TD
          ref: rsk-4.4-clean2
          path: kernel
          # Jangan andalkan submodule: KernelSU-Next-v320 bukan submodule
          submodules: false

      - name: Clone KernelSU-Next legacy + SUSFS v2
        working-directory: kernel
        env:
          KSU_REPO: ${{ github.event.inputs.ksu_repo }}
          KSU_BRANCH: ${{ github.event.inputs.ksu_branch }}
          KSU_DIR: ${{ github.event.inputs.ksu_dir }}
        run: |
          set -e
          echo "=== Clone $KSU_REPO ($KSU_BRANCH) -> $KSU_DIR ==="
          rm -rf "$KSU_DIR"
          git clone --depth 1 -b "$KSU_BRANCH" "$KSU_REPO" "$KSU_DIR"
          echo "=== Cek isi KSU ==="
          ls -la "$KSU_DIR/kernel" | head -20
          if [ ! -f "$KSU_DIR/kernel/Kconfig" ]; then
            echo "::error::$KSU_DIR/kernel/Kconfig tidak ada. Cek repo/branch KSU."
            exit 1
          fi
          echo "=== Pastikan symlink drivers/kernelsu resolve ==="
          if [ ! -e drivers/kernelsu/Kconfig ]; then
            echo "::warning::symlink drivers/kernelsu tidak resolve, buat manual"
            ln -sfn "../$KSU_DIR/kernel" drivers/kernelsu
          fi
          if [ ! -e drivers/kernelsu/Kconfig ]; then
            echo "::error::drivers/kernelsu/Kconfig tetap tidak ada setelah symlink"
            ls -la drivers/kernelsu || true
            exit 1
          fi
          echo "drivers/kernelsu -> $(readlink -f drivers/kernelsu)"

      - name: Select toolchain
        id: tc
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
        run: |
          case "$TOOLCHAIN" in
            llvm)
              echo "dir=$HOME/neutron-clang" >> "$GITHUB_OUTPUT"
              echo "key=llvm-24-neutron-06092026" >> "$GITHUB_OUTPUT"
              ;;
            gcc)
              echo "dir=$HOME/gcc-arm64" >> "$GITHUB_OUTPUT"
              echo "key=gcc-eva-arm64-06052026" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "dir=" >> "$GITHUB_OUTPUT"
              echo "key=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Cache toolchain
        id: tc_cache
        if: ${{ github.event.inputs.toolchain != 'default' }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.tc.outputs.dir }}
          key: ${{ steps.tc.outputs.key }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo apt-get install -y clang llvm lld
          sudo apt-get install -y zstd wget xz-utils

      - name: Fetch toolchain
        if: ${{ github.event.inputs.toolchain != 'default' && steps.tc_cache.outputs.cache-hit != 'true' }}
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
        run: |
          if [ "$TOOLCHAIN" = "llvm" ]; then
            mkdir -p "$HOME/neutron-clang"
            wget -q "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst" -O /tmp/clang.tar.zst
            tar -xf /tmp/clang.tar.zst -C "$HOME/neutron-clang"
            rm -f /tmp/clang.tar.zst
          else
            cd "$HOME"
            wget -q "https://github.com/mvaisakh/gcc-build/releases/download/06052026/eva-gcc-arm64-06052026.xz" -O gcc.tar.xz
            tar -xf gcc.tar.xz
            rm -f gcc.tar.xz
          fi

      - name: Setup toolchain environment
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
        run: |
          case "$TOOLCHAIN" in
            llvm)
              TC="$HOME/neutron-clang"
              echo "$TC/bin" >> "$GITHUB_PATH"
              echo "LD_LIBRARY_PATH=$TC/lib:$TC/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
              echo "TC_MAKE_ARGS=LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              ;;
            gcc)
              TC="$HOME/gcc-arm64"
              prefix=""
              for p in aarch64-linux-android- aarch64-linux-gnu- aarch64-elf- aarch64-linux-; do
                if [ -f "$TC/bin/${p}gcc" ]; then prefix="$p"; break; fi
              done
              if [ -z "$prefix" ]; then
                echo "::error::gcc aarch64 tidak ditemukan di $TC/bin"
                exit 1
              fi
              echo "$TC/bin" >> "$GITHUB_PATH"
              echo "TC_MAKE_ARGS=CROSS_COMPILE=$TC/bin/$prefix CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              ;;
            *)
              echo "TC_MAKE_ARGS=CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
              ;;
          esac
          echo "TC_KCFLAGS=-w" >> "$GITHUB_ENV"

      - name: Make defconfig (KSU + SuSFS)
        working-directory: kernel
        run: |
          set -e
          # Build in-tree sesuai resep rilis RSKSeven
          make ARCH=${{ env.ARCH }} $TC_MAKE_ARGS ${{ github.event.inputs.defconfig }}
          # Pastikan KSU & SuSFS aktif (defconfig sudah CONFIG_KSU=y; Kconfig default SUSFS=y)
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
          } >> .config
          yes "" | make ARCH=${{ env.ARCH }} $TC_MAKE_ARGS oldconfig
          echo "=== Config KSU/SUSFS ==="
          grep -E "CONFIG_KSU|CONFIG_THREAD_INFO_IN_TASK|CONFIG_KPROBES" .config || true

      - name: Build kernel
        working-directory: kernel
        run: |
          echo "CPU cores: $(nproc)"
          make ARCH=${{ env.ARCH }} $TC_MAKE_ARGS KCFLAGS="$TC_KCFLAGS" -j"$(nproc)"

      - name: Build DTB + Image.gz-dtb
        working-directory: kernel
        run: |
          set -e
          make ARCH=${{ env.ARCH }} $TC_MAKE_ARGS dtbs
          # Defconfig punya CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y, biasanya sudah jadi
          if [ ! -f arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb belum ada, gabungkan manual"
            DTB=$(find arch/arm64/boot/dts -iname "*x00td*.dtb" | head -1)
            if [ -z "$DTB" ]; then DTB=$(find arch/arm64/boot/dts -name "sdm636.dtb" | head -1); fi
            if [ -z "$DTB" ]; then DTB=$(find arch/arm64/boot/dts -name "sdm660.dtb" | head -1); fi
            if [ -z "$DTB" ]; then echo "::error::DTB tidak ditemukan"; exit 1; fi
            cat arch/arm64/boot/Image.gz "$DTB" > arch/arm64/boot/Image.gz-dtb
          fi
          ls -lh arch/arm64/boot/Image.gz arch/arm64/boot/Image.gz-dtb

      - name: Verify KSU + SuSFS di build output
        working-directory: kernel
        continue-on-error: true
        run: |
          echo "=== CONFIG_KSU di .config ==="
          grep -E "CONFIG_KSU" .config || true
          echo "=== Simbol KSU/SuSFS di System.map ==="
          if grep -qi "susfs" System.map; then
            echo "OK: simbol susfs ada"
          else
            echo "::warning::simbol susfs TIDAK ada — cek config / source KSU"
          fi
          if grep -qi "ksu" System.map; then
            echo "OK: simbol ksu ada"
          else
            echo "::warning::simbol ksu TIDAK ada"
          fi

      - name: Upload Image.gz-dtb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-RSKSeven-X00TD-4.4-${{ github.event.inputs.toolchain }}-${{ github.run_id }}
          path: kernel/arch/arm64/boot/Image.gz-dtb
