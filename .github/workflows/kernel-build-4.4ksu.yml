name: Build RSKSeven X00TD 4.4 (KSU Next v3.4.0 + SuSFS)
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig'
        required: true
        default: 'X00TD_defconfig'
      toolchain:
        description: 'Toolchain'
        type: choice
        default: 'gcc'
        options: [gcc, default, llvm]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      CC: clang
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      KSU_REPO: 'https://github.com/KernelSU-Next/KernelSU-Next'
      KSU_BRANCH: 'legacy'
      KSU_DIR: 'KernelSU-Next-v340'

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: rusakseven/RSKSevenProject-X00TD
          ref: rsk-4.4-clean2
          path: kernel
          submodules: false

      - name: Clone KSU Next & Fix SuSFS
        working-directory: kernel
        run: |
          set -e
          # 1. Clone KSU Next v3.4.0
          rm -rf "$KSU_DIR"
          git clone --depth 1 -b "$KSU_BRANCH" "$KSU_REPO" "$KSU_DIR"
          
          # 2. Setup Symlink
          if [ ! -e drivers/kernelsu/Kconfig ]; then
            ln -sfn "../$KSU_DIR/kernel" drivers/kernelsu
          fi

          # 3. Download Source SuSFS v2.3.0 (GitLab branch kernel-4.4)
          echo "Downloading SuSFS v2.3.0..."
          SUSFS_URL="https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.4"
          curl -LSsf "$SUSFS_URL/fs/susfs.c" -o fs/susfs.c || echo "Gagal download susfs.c, pakai yg di repo"
          curl -LSsf "$SUSFS_URL/include/linux/susfs.h" -o include/linux/susfs.h || echo "Gagal download susfs.h"
          curl -LSsf "$SUSFS_URL/include/linux/susfs_def.h" -o include/linux/susfs_def.h || echo "Gagal download susfs_def.h"

          # 4. Paksa hapus panggilan susfs_try_umount di KSU Next (Biar linker gak error)
          echo "Patching KSU Next..."
          sed -i -E 's/^([[:space:]]*)susfs_try_umount\(.*\);/\1\/\/ disabled by workflow/' drivers/kernelsu/hook/setuid_hook.c || true
          sed -i -E 's/^([[:space:]]*)susfs_add_try_umount\(.*\);/\1\/\/ disabled by workflow/' drivers/kernelsu/supercall/supercall.c || true

      - name: Patch Compiler GCC
        working-directory: kernel
        run: |
          cat >> include/linux/compiler-gcc.h <<'EOF'
          #ifndef __clang__
          #ifndef __nocfi
          #define __nocfi
          #endif
          #ifndef __noscs
          #define __noscs
          #endif
          #endif
          EOF

      - name: Setup Toolchain
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
        run: |
          if [ "$TOOLCHAIN" = "llvm" ]; then
            mkdir -p "$HOME/neutron-clang"
            wget -q "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst" -O /tmp/clang.tar.zst
            tar -xf /tmp/clang.tar.zst -C "$HOME/neutron-clang"
            echo "$HOME/neutron-clang/bin" >> "$GITHUB_PATH"
            echo "LD_LIBRARY_PATH=$HOME/neutron-clang/lib:$HOME/neutron-clang/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "TC_MAKE_ARGS=LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
          elif [ "$TOOLCHAIN" = "gcc" ]; then
            cd "$HOME"
            wget -q "https://github.com/mvaisakh/gcc-build/releases/download/06052026/eva-gcc-arm64-06052026.xz" -O gcc.tar.xz
            tar -xf gcc.tar.xz
            rm -f gcc.tar.xz
            TC="$HOME/gcc-arm64"
            prefix=""
            for p in aarch64-linux-android- aarch64-linux-gnu- aarch64-elf- aarch64-linux-; do
              if [ -f "$TC/bin/${p}gcc" ]; then prefix="$p"; break; fi
            done
            echo "$TC/bin" >> "$GITHUB_PATH"
            echo "TC_MAKE_ARGS=CROSS_COMPILE=$TC/bin/$prefix CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
          else
            echo "TC_MAKE_ARGS=CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
          fi
          echo "TC_KCFLAGS=-w -D_LINUX -D__nocfi=" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang llvm lld zstd wget xz-utils

      - name: Make Defconfig
        working-directory: kernel
        run: |
          make ARCH=arm64 $TC_MAKE_ARGS ${{ github.event.inputs.defconfig }}
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_SUSFS=y" >> .config
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> .config
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> .config
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> .config
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> .config
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> .config
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> .config
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> .config
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> .config
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> .config
          yes "" | make ARCH=arm64 $TC_MAKE_ARGS oldconfig

      - name: Build Kernel
        working-directory: kernel
        run: |
          make ARCH=arm64 $TC_MAKE_ARGS KCFLAGS="$TC_KCFLAGS" -j$(nproc)
          make ARCH=arm64 $TC_MAKE_ARGS dtbs
          if [ ! -f arch/arm64/boot/Image.gz-dtb ]; then
            DTB=$(find arch/arm64/boot/dts -iname "*x00td*.dtb" | head -1)
            cat arch/arm64/boot/Image.gz "$DTB" > arch/arm64/boot/Image.gz-dtb
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-X00TD-4.4-KSUNext-SuSFS
          path: kernel/arch/arm64/boot/Image.gz-dtb
