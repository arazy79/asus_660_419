name: Kernel Build X00TD 4.19 skywalker KSU
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig path (relatif dari arch/arm64/configs/)'
        required: true
        default: 'X00TD_defconfig'
      enable_ksu:
        description: 'Enable KernelSU (centang = ON)'
        type: boolean
        default: false
      ksu_setup_url:
        description: 'KernelSU setup.sh URL (dipakai kalau KSU ON)'
        required: true
        default: 'https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh'
      ksu_branch:
        description: 'KernelSU branch / tag / commit (argumen setup.sh)'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      # Neutron Clang setup
      TC_DIR: $HOME/neutron-clang
      LLVM: 1
      LLVM_IAS: 1
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      CCACHE_DIR: ${{ github.workspace }}/kernel/out/.ccache

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: arazy79/asus_660_419
          ref: 13
          path: kernel
          submodules: recursive

      - name: Apply close_range backport
        working-directory: kernel
        run: |
          if [ ! -f close_range_backport.patch ]; then
            echo "::error::close_range_backport.patch tidak ada di root repo branch 13"
            exit 1
          fi
          if git apply -R --check close_range_backport.patch 2>/dev/null; then
            echo "close_range backport sudah ter-apply di source, skip"
          else
            git apply --check close_range_backport.patch
            git apply close_range_backport.patch
            echo "close_range backport applied"
          fi
          echo "=== cek hasil ==="
          grep -n "SYSCALL_DEFINE3(close_range" fs/open.c || true
          grep -n "__NR_close_range\|define __NR_syscalls" include/uapi/asm-generic/unistd.h || true

      - name: Setup KernelSU
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        env:
          KSU_URL: ${{ github.event.inputs.ksu_setup_url }}
          KSU_BRANCH: ${{ github.event.inputs.ksu_branch }}
        run: |
          if [ -z "$KSU_URL" ]; then
            echo "::error::enable_ksu dicentang tapi ksu_setup_url kosong"
            exit 1
          fi
          if [ ! -f arch/arm64/configs/vendor/extra/ksu.config ]; then
            echo "::error::arch/arm64/configs/vendor/extra/ksu.config tidak ada di source"
            exit 1
          fi
          echo "::group::KernelSU setup"
          echo "KSU script : $KSU_URL"
          echo "KSU branch : $KSU_BRANCH"
          curl -LSs "$KSU_URL" | bash -s "$KSU_BRANCH"
          echo "--- drivers/kernelsu ---"
          ls -la drivers/kernelsu || true
          echo "--- Makefile / Kconfig hook ---"
          grep -n kernelsu drivers/Makefile drivers/Kconfig || true
          echo "::endgroup::"
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "::error::drivers/kernelsu/Kconfig tidak ada, setup KernelSU gagal"
            exit 1
          fi

      - name: Restore toolchain cache
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: ${{ env.TC_DIR }}
          key: neutron-clang-24-${{ github.run_id }}
          restore-keys: |
            neutron-clang-24-

      - name: Download & setup Neutron Clang 24
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          mkdir -p $TC_DIR
          # Neutron Clang 24 - pilih salah satu, sesuaikan URL
          # Versi terbaru 06092026
          URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst"
          wget "$URL" -O /tmp/clang.tar.zst
          tar --zstd -xvf /tmp/clang.tar.zst -C $TC_DIR
          rm -f /tmp/clang.tar.zst
          echo "Toolchain ready di $TC_DIR"
          $TC_DIR/bin/clang --version | head -n 1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kernel-build-${{ github.run_id }}
          restore-keys: |
            kernel-build-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libncurses-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils zip zlib1g-dev
          # Hapus clang sistem biar nggak bentrok
          sudo apt-get remove -y clang llvm lld || true

      - name: Debug - Check files
        run: |
          echo "=== Kernel directory ==="
          ls -la kernel/
          echo "=== Defconfig ==="
          ls -la kernel/arch/arm64/configs/vendor/asus/${{ github.event.inputs.defconfig }} || echo "TIDAK ADA!"

      - name: Prepare output directory
        run: mkdir -p kernel/out

      - name: Make defconfig
        working-directory: kernel
        env:
          ENABLE_KSU: ${{ github.event.inputs.enable_ksu }}
        run: |
          cp arch/arm64/configs/vendor/asus/${{ github.event.inputs.defconfig }} out/.config
          if [ "$ENABLE_KSU" = "true" ]; then
            echo "KernelSU: ON"
            cat arch/arm64/configs/vendor/extra/ksu.config >> out/.config
          else
            echo "KernelSU: OFF"
          fi
          yes "" | make ARCH=$ARCH O=out oldconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$TC_DIR/bin:$PATH"
          export LD_LIBRARY_PATH="$TC_DIR/lib:$TC_DIR/lib64:${LD_LIBRARY_PATH:-}"
          export CC="ccache clang"
          export CXX="ccache clang++"
          
          echo "Compiler: $(clang --version | head -n 1)"
          echo "PATH: $TC_DIR/bin didahulukan"
          
          make ARCH=$ARCH O=out \
            CC="$CC" \
            CXX="$CXX" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            KCFLAGS="-Wno-error" \
            -j$(nproc)

      - name: Verify close_range
        working-directory: kernel
        continue-on-error: true
        run: |
          if grep -E "sys_close_range" out/System.map; then
            echo "OK: sys_close_range ada"
          else
            echo "::warning::sys_close_range TIDAK ada — hotspot mungkin gagal"
            exit 1
          fi

      - name: Verify KernelSU
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        working-directory: kernel
        continue-on-error: true
        run: |
          grep "CONFIG_KSU" out/.config || true
          if grep -q "^CONFIG_KSU=y" out/.config && grep -qi "ksu" out/System.map; then
            echo "OK: KernelSU aktif"
          else
            echo "::warning::KernelSU belum aktif"
            exit 1
          fi

      - name: Build DTB + Image.gz-dtb
        working-directory: kernel
        run: |
          export PATH="$TC_DIR/bin:$PATH"
          make ARCH=$ARCH O=out dtbs -j$(nproc)
          
          DTB=$(find out/arch/arm64/boot/dts -iname "*x00td*.dtb" -o -name "sdm636.dtb" -o -name "sdm660.dtb" | head -1)
          if [ -z "$DTB" ]; then
            echo "ERROR: DTB tidak ketemu!"
            exit 1
          fi
          echo "Pakai DTB: $DTB"
          cat out/arch/arm64/boot/Image.gz "$DTB" > out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Upload hasil
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-X00TD-4.19-Neutron24-${{ github.event.inputs.enable_ksu == 'true' && 'KSU' || 'NOKSU' }}-${{ github.run_id }}
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
