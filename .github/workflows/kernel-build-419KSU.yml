      - name: Build kernel
        working-directory: kernel
        env:
          TC_DIR: ${{ steps.tc.outputs.tc_dir }}
          USE_LLVM: ${{ steps.tc.outputs.use_llvm }}
          CROSS_COMPILE: ${{ steps.tc.outputs.cross_comp }}
          TOOLCHAIN_DESC: ${{ steps.tc.outputs.desc }}
          ENABLE_KSU: ${{ github.event.inputs.enable_ksu }}
        run: |
          export PATH="$TC_DIR/bin:$PATH"
          export LD_LIBRARY_PATH="$TC_DIR/lib:$TC_DIR/lib64:${LD_LIBRARY_PATH:-}"
          
          if [ "$USE_LLVM" = "1" ]; then
            # Kernel 4.19 butuh LLVM_IAS=0 — vDSO belum kompatibel
            export LLVM=1
            export LLVM_IAS=0
            export CC="ccache clang"
            export CXX="ccache clang++"
            export LD="ld.lld"
            echo "🔨 $TOOLCHAIN_DESC — Clang + ld.lld + GNU as (LLVM_IAS=0)"
            clang --version | head -n 1
          else
            unset LLVM
            unset LLVM_IAS
            export CC="ccache ${CROSS_COMPILE}gcc"
            export CXX="ccache ${CROSS_COMPILE}g++"
            export LD="${CROSS_COMPILE}ld"
            echo "🔨 $TOOLCHAIN_DESC — GCC"
            $CC --version | head -n 1
          fi
          
          mkdir -p out
          cp arch/arm64/configs/vendor/asus/${{ github.event.inputs.defconfig }} out/.config
          
          # Matikan COMPAT_VDSO biar aman
          sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/' out/.config
          
          if [ "$ENABLE_KSU" = "true" ]; then
            cat arch/arm64/configs/vendor/extra/ksu.config >> out/.config
            echo "✅ KernelSU aktif"
          fi
          
          yes "" | make ARCH=$ARCH O=out oldconfig
          
          echo "🚀 Build mulai..."
          make ARCH=$ARCH O=out \
            CC="$CC" \
            CXX="$CXX" \
            LD="$LD" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            -j$(nproc)
