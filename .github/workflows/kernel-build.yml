name: Kernel Build X00TD 4.19 skywalker
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig path (relatif dari arch/arm64/configs/)'
        required: true
        default: 'X00TD_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      CC: clang
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      CCACHE_DIR: ${{ github.workspace }}/kernel/out/.ccache
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: arazy79/asus_660_419
          ref: 13
          path: kernel
          submodules: recursive

      - name: Restore ccache & build cache
        uses: actions/cache@v4
        with:
          path: |
            kernel/out/.ccache
            kernel/out
          key: kernel-build-${{ github.run_id }}
          restore-keys: |
            kernel-build-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo apt-get install -y clang llvm lld

      - name: Debug - Check files
        run: |
          echo "=== Kernel directory contents ==="
          ls -la kernel/
          echo "=== Defconfig exists? ==="
          ls -la kernel/arch/arm64/configs/vendor/asus/${{ github.event.inputs.defconfig }} || echo "FILE NOT FOUND!"
          echo "=== All defconfigs ==="
          ls -la kernel/arch/arm64/configs/

      - name: Prepare output directory
        run: |
          mkdir -p kernel/out

      - name: Make defconfig
        working-directory: kernel
        run: |
          cp arch/arm64/configs/asus/${{ github.event.inputs.defconfig }} out/.config
          yes "" | make ARCH=${{ env.ARCH }} O=out oldconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          export CC="ccache clang"
          export CXX="ccache clang++"
          make ARCH=${{ env.ARCH }} O=out CC="${{ env.CC }}" CROSS_COMPILE="${{ env.CROSS_COMPILE }}" CROSS_COMPILE_ARM32="${{ env.CROSS_COMPILE_ARM32 }}" KCFLAGS="-Wno-error" -j2

      - name: Build DTB + Image.gz-dtb
        working-directory: kernel
        run: |
          make ARCH=${{ env.ARCH }} O=out CC="${{ env.CC }}" CROSS_COMPILE="${{ env.CROSS_COMPILE }}" dtbs
          echo "=== All DTB files ==="
          find out/arch/arm64/boot/dts -name "*.dtb" | sort
          # Cari DTB untuk X00TD
          DTB=$(find out/arch/arm64/boot/dts -iname "*x00td*.dtb" | head -1)
          # Kalau gak ada, coba sdm636.dtb
          if [ -z "$DTB" ]; then
            DTB=$(find out/arch/arm64/boot/dts -name "sdm636.dtb" | head -1)
          fi
          # Kalau masih gak ada, coba sdm660.dtb
          if [ -z "$DTB" ]; then
            DTB=$(find out/arch/arm64/boot/dts -name "sdm660.dtb" | head -1)
          fi
          if [ -z "$DTB" ]; then
            echo "ERROR: No DTB found! Build failed."
            exit 1
          fi
          echo "Using DTB: $DTB"
          cat out/arch/arm64/boot/Image.gz "$DTB" > out/arch/arm64/boot/Image.gz-dtb
          echo "=== Final size ==="
          ls -lh out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb

      - name: Check build result
        run: |
          ls -la kernel/out/arch/arm64/boot/

      - name: Upload Image.gz-dtb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build-X00TD-SKYWALKER-4.19-${{ github.run_id }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
