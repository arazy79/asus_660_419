name: Upstream Merge 4.19.325
on:
  workflow_dispatch:

permissions:
  contents: write  # ← Izinkan push ke repo

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch 16
        uses: actions/checkout@v4
        with:
          ref: '16'
          fetch-depth: 0

      - name: Buat branch baru
        run: |
          git checkout -b upstream-4.19.325
          echo "✅ Branch dibuat: upstream-4.19.325"

      - name: Tambah remote upstream kernel
        run: |
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git fetch linux-stable linux-4.19.y

      - name: Merge — Izinkan sejarah tidak berhubungan + Utamakan versi kamu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --allow-unrelated-histories -X ours linux-stable/linux-4.19.y --no-edit
          echo "=== Merge selesai ==="

      - name: Push branch baru
        run: |
          git push -u origin upstream-4.19.325
          echo "✅ Branch sudah di-push ke repo"
